name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Matches the runner environment python version
          
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 shiboken6 jinja2 pkginfo tqdm packaging==24.1
          
      - name: Initialize Android Deploy
        run: pyside6-android-deploy --init
        
      - name: Build APK
        run: pyside6-android-deploy --config-file pysidedeploy.spec
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpg-manager-apk
          path: dist_android/*.apk