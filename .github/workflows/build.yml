
name: Build LPG Manager Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install deployment tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6

      - name: Initialize deployment configuration
        run: |
          pyside6-android-deploy --init

      - name: Build Android APK
        run: |
          pyside6-android-deploy --name "LPG Manager" --force

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpg-manager-apk
          path: |
            **/*.apk
          if-no-files-found: warn
          retention-days: 7
